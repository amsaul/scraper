version: '3.9'

services:
  mongo:
    image: mongo:6.0
    container_name: verivote-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2
    container_name: verivote-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mongo_data:
    name: verivote-mongo-data
